name: Bangun APK SAPE

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Nama versi yang tampil di HP (contoh: 39.0)"
        required: true
        default: "39.0"
      versionCode:
        description: "Nomor versi internal. WAJIB naik setiap rilis."
        required: true
        default: "39"

jobs:
  bangun:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Siapkan JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Periksa alamat hosting sudah diisi
        run: |
          if grep -q "GANTI-DENGAN-DOMAIN-ANDA" app/src/main/res/values/strings.xml; then
            echo "::error::strings.xml masih berisi placeholder. Isi host_name, launch_url, dan asset_statements dulu."
            exit 1
          fi

      - name: Pulihkan keystore dari secret
        env:
          KEYSTORE_B64: ${{ secrets.SAPE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret SAPE_KEYSTORE_BASE64 belum diisi."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sape.jks"

      - name: Terapkan nomor versi
        run: |
          sed -i "s/versionCode .*/versionCode ${{ inputs.versionCode }}/"        app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ inputs.versionName }}\"/" app/build.gradle

      - name: Bangun APK rilis
        env:
          SAPE_KEYSTORE_FILE:     ${{ runner.temp }}/sape.jks
          SAPE_KEYSTORE_PASSWORD: ${{ secrets.SAPE_KEYSTORE_PASSWORD }}
          SAPE_KEY_ALIAS:         ${{ secrets.SAPE_KEY_ALIAS }}
          SAPE_KEY_PASSWORD:      ${{ secrets.SAPE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Ambil sidik jari dan susun assetlinks.json
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -r | head -1)
          APK=app/build/outputs/apk/release/app-release.apk
          SHA=$("$APKSIGNER" verify --print-certs "$APK" \
                | grep -i "SHA-256 digest" | head -1 \
                | sed 's/.*: *//' | tr -d ' ' \
                | sed 's/../&:/g; s/:$//' | tr 'a-f' 'A-F')
          echo "Sidik jari SHA-256: $SHA"
          PKG=$(grep applicationId app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p keluaran
          cat > keluaran/assetlinks.json <<JSON
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "$PKG",
              "sha256_cert_fingerprints": ["$SHA"]
            }
          }]
          JSON
          cp "$APK" keluaran/SAPE-${{ inputs.versionName }}.apk
          cat keluaran/assetlinks.json

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: SAPE-APK-${{ inputs.versionName }}
          path: keluaran/
