plugins { id "com.android.application" }

android {
    namespace "id.sch.sape"
    compileSdk 35

    defaultConfig {
        applicationId "id.sch.sape"
        minSdk 23
        targetSdk 35
        versionCode 39
        versionName "39.0"
    }

    signingConfigs {
        release {
            // Nilai diisi dari environment saat build di CI.
            // Tidak ada kredensial yang ditulis di dalam berkas ini.
            def ks = System.getenv("SAPE_KEYSTORE_FILE")
            if (ks) {
                storeFile     file(ks)
                storePassword System.getenv("SAPE_KEYSTORE_PASSWORD")
                keyAlias      System.getenv("SAPE_KEY_ALIAS")
                keyPassword   System.getenv("SAPE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Trusted Web Activity tanpa satu baris pun kode Java/Kotlin.
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
